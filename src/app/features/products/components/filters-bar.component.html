<div class="card bg-base-100 border border-base-200 shadow-md">
  <div class="card-body gap-4">
    <div class="collapse collapse-arrow lg:collapse-open">
      <input type="checkbox" class="peer lg:hidden" />
      <div class="collapse-title text-sm font-semibold lg:hidden flex items-center gap-2">
        <lucide-icon [img]="icons.SlidersHorizontal" class="w-4 h-4" />
        Ver más filtros
      </div>
      <div class="collapse-content p-0 pt-2">
        <div class="grid grid-cols-1 lg:grid-cols-6 gap-4">
          <div class="lg:col-span-2">
            <label class="text-xs font-semibold text-base-content/70">Categoria</label>
            <select class="select select-bordered w-full" [ngModel]="filters.categoryId" (ngModelChange)="onCategoryChange($event)">
              <option [ngValue]="null">Todas</option>
              @for (category of categories; track category.id) {
                <option [ngValue]="category.id">{{ category.name }}</option>
              }
            </select>
          </div>
          <div class="lg:col-span-2">
            <label class="text-xs font-semibold text-base-content/70">Subcategoria</label>
            <select
              class="select select-bordered w-full"
              [ngModel]="filters.subcategoryId"
              (ngModelChange)="onSubcategoryChange($event)"
              [disabled]="!filters.categoryId"
            >
              <option [ngValue]="null">Todas</option>
              @for (subcategory of subcategories; track subcategory.id) {
                <option [ngValue]="subcategory.id">{{ subcategory.name }}</option>
              }
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/70">Orden</label>
            <select class="select select-bordered w-full" [ngModel]="filters.sort" (ngModelChange)="onSortChange($event)">
              <option value="cheap">Mas baratos</option>
              <option value="expensive">Mas caros</option>
              <option value="newest">Mas nuevos</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3 lg:col-span-2">
            <div class="flex flex-col justify-between">
              <label class="text-xs font-semibold text-base-content/70">Importado</label>
              <input
                type="checkbox"
                class="toggle toggle-success"
                [checked]="!!filters.isImported"
                (change)="toggleImported($any($event.target).checked)"
                aria-label="Filtrar importados"
              />
            </div>
            <div class="flex flex-col justify-between">
              <label class="text-xs font-semibold text-base-content/70">Minimo de compra</label>
              <input
                type="checkbox"
                class="toggle toggle-success"
                [checked]="!!filters.hasMinPurchase"
                (change)="toggleMinPurchase($any($event.target).checked)"
                aria-label="Filtrar por minimo de compra"
              />
            </div>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
          <div>
            <label class="text-xs font-semibold text-base-content/70">Precio minimo</label>
            <input
              type="number"
              class="input input-bordered w-full"
              [ngModel]="minInput()"
              (ngModelChange)="minInput.set(parseNumber($event))"
              min="0"
              placeholder="0"
            />
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/70">Precio maximo</label>
            <input
              type="number"
              class="input input-bordered w-full"
              [ngModel]="maxInput()"
              (ngModelChange)="maxInput.set(parseNumber($event))"
              min="0"
              max="5000000"
              placeholder="5000000"
            />
          </div>
          <button class="btn btn-primary" type="button" (click)="applyPriceRange()">
            Aplicar precio
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
