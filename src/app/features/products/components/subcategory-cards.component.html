<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
  @for (subcategory of subcategories; track subcategory.id) {
    <button
      class="card bg-base-100 border border-base-200 hover:border-primary/60 transition text-left shadow-sm hover:shadow-md cursor-pointer"
      type="button"
      (click)="selectSubcategory.emit(subcategory)"
    >
      <div class="card-body">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h3 class="card-title">{{ subcategory.name }}</h3>
            <p class="text-sm text-base-content/70">Ver productos</p>
          </div>
          <lucide-icon [img]="getIcon(subcategory.icon_name)" class="w-6 h-6 text-primary" />
        </div>
      </div>
    </button>
  }
</div>
