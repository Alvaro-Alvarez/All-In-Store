<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
  <button
    class="card bg-base-100 border border-dashed border-primary/40 hover:border-primary transition shadow-sm hover:shadow-md cursor-pointer"
    type="button"
    (click)="viewAll.emit()"
  >
    <div class="card-body">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h3 class="card-title text-primary">Ver todos</h3>
          <p class="text-sm text-base-content/70">Explora el catalogo completo.</p>
        </div>
        <lucide-icon [img]="getIcon('LayoutGrid')" class="w-6 h-6 text-primary" />
      </div>
    </div>
  </button>
  @for (category of categories; track category.id) {
    <button
      class="card bg-base-100 border border-base-200 hover:border-primary/60 transition text-left shadow-sm hover:shadow-md cursor-pointer"
      type="button"
      (click)="selectCategory.emit(category)"
    >
      <div class="card-body">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h3 class="card-title">{{ category.name }}</h3>
            <p class="text-sm text-base-content/70">Ver subcategorias</p>
          </div>
          <lucide-icon [img]="getIcon(category.icon_name)" class="w-6 h-6 text-primary" />
        </div>
      </div>
    </button>
  }
</div>
