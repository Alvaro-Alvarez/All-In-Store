<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
  <button
    class="card bg-base-100 border border-dashed border-primary/40 hover:border-primary transition"
    type="button"
    (click)="viewAll.emit()"
  >
    <div class="card-body">
      <h3 class="card-title text-primary">Ver todos</h3>
      <p class="text-sm text-base-content/70">Explora el catalogo completo.</p>
    </div>
  </button>
  @for (category of categories; track category.id) {
    <button
      class="card bg-base-100 border border-base-200 hover:border-primary/60 transition text-left"
      type="button"
      (click)="selectCategory.emit(category)"
    >
      <div class="card-body">
        <h3 class="card-title">{{ category.name }}</h3>
        <p class="text-sm text-base-content/70">Ver subcategorias</p>
      </div>
    </button>
  }
</div>
