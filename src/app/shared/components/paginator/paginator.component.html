<div class="flex flex-col sm:flex-row items-center justify-between gap-3">
  <span class="text-sm">Pagina {{ page }} de {{ totalPages() }}</span>
  <div class="join">
    <button class="btn btn-sm join-item" (click)="goTo(page - 1)" [disabled]="page <= 1">
      Prev
    </button>
    @for (p of pages(); track p) {
      <button
        class="btn btn-sm join-item"
        [class.btn-active]="p === page"
        (click)="goTo(p)"
      >
        {{ p }}
      </button>
    }
    <button
      class="btn btn-sm join-item"
      (click)="goTo(page + 1)"
      [disabled]="page >= totalPages()"
    >
      Next
    </button>
  </div>
</div>
